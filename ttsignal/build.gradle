plugins {
    id 'com.android.library'
    id 'maven-publish'
}

// Regenerated by buildNativeLibs on every build, so it must not live under src/ where it
// would rewrite checked-in binaries.
def nativeJniLibsDir = layout.buildDirectory.dir('nativeJniLibs').get().asFile

android {
    namespace 'org.difft.android.smp'
    compileSdkVersion androidSdk.compileVersion
    ndkVersion '28.0.13004108'

    defaultConfig {
        minSdkVersion androidSdk.minVersion
        targetSdkVersion androidSdk.targetVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility java_version
        targetCompatibility java_version
    }
    sourceSets {
        main {
            jniLibs.srcDirs = [nativeJniLibsDir]
        }
    }
    publishing {
        singleVariant("release") {
            withJavadocJar()
            withSourcesJar()
        }
    }
}

tasks.register('buildNativeLibs', Exec) {
    description = 'Build native .so libraries into the generated jniLibs directory'

    def submoduleDir = file('ttsignal')
    def buildScript = file('ttsignal/android/scripts/build-so.sh')

    onlyIf {
        if (!buildScript.exists()) {
            throw new GradleException(
                'ttsignal submodule not initialized. ' +
                'Run: git submodule update --init ttsignal/ttsignal')
        }
        return true
    }

    workingDir submoduleDir

    def sdkDir = android.sdkDirectory
    def ndkDir = android.ndkDirectory
    environment 'ANDROID_HOME', sdkDir.absolutePath
    environment 'ANDROID_SDK_ROOT', sdkDir.absolutePath
    environment 'ANDROID_NDK_HOME', ndkDir.absolutePath

    commandLine 'bash', 'android/scripts/build-so.sh'

    doLast {
        ['arm64-v8a', 'armeabi-v7a'].each { abi ->
            // The submodule also holds Debug builds of this library under android/app/build,
            // so accept nothing but build-so.sh's release output: a broader search silently
            // ships a debug binary.
            def built = new File(submoduleDir, "android/build/${abi}/libsignal.so")
            if (!built.exists()) {
                throw new GradleException(
                    "native build produced no libsignal.so for ${abi} at ${built}")
            }

            def destDir = new File(nativeJniLibsDir, abi)
            destDir.mkdirs()

            def dest = new File(destDir, 'libsignal.so')
            java.nio.file.Files.copy(
                built.toPath(),
                dest.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "copied: ${built} -> ${dest}"
        }
    }
}

tasks.register('rebuildNativeLibs') {
    description = 'Clean and force-rebuild native .so libraries'
    group = 'build'

    def buildRoot = new File(file('ttsignal'), 'android/build')

    doFirst {
        if (buildRoot.exists()) {
            println "cleaning: ${buildRoot}"
            buildRoot.deleteDir()
        }
        if (nativeJniLibsDir.isDirectory()) {
            println "cleaning: ${nativeJniLibsDir}"
            nativeJniLibsDir.deleteDir()
        }
    }

    finalizedBy 'buildNativeLibs'
}

tasks.configureEach { task ->
    if (task.name == 'mergeReleaseJniLibFolders' || task.name == 'mergeDebugJniLibFolders') {
        task.dependsOn 'buildNativeLibs'
    }
}

dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = GROUP
                artifactId = POM_ARTIFACT_ID
                version = VERSION_NAME
            }
        }
    }
}
